schema_version = "1.1"

[task]
name = "hpc/ior-backend-integrity"
description = "Repair cross-backend data integrity, AIO boundary handling, seeded rank shuffling, and machine-readable output in the IOR HPC benchmark."
authors = []
keywords = ["hpc", "mpi-io", "linux-aio", "parallel-filesystem", "ior"]

[metadata]
difficulty = "expert"
category = "systems"
tags = ["hpc", "c", "mpi", "async-io", "diagnosis", "reliability"]

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 4
memory_mb = 4096
storage_mb = 6144
gpus = 0
allow_internet = true
mcp_servers = []
workdir = "/work/ior"

[environment.healthcheck]
command = "test -x /work/ior/src/ior && mpirun --oversubscribe -n 1 /work/ior/src/ior -a POSIX -b 4k -t 4k -s 1 -F -w -r -o /tmp/ior-healthcheck >/dev/null 2>&1"
interval_sec = 1.0
timeout_sec = 10.0
start_period_sec = 0.0
start_interval_sec = 1.0
retries = 2

[verifier.env]

[solution.env]
